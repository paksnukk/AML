[package]
name = "aml_core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[features]
default = ["std"]
# WAV file I/O and the legacy V1 phy. Without it the crate is `no_std` + `alloc`.
std = ["dep:hound", "dep:serde", "dep:serde_json"]

[dependencies]
libm = "0.2"
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
hound = { version = "3.5", optional = true }

[dev-dependencies]
tempfile = "3"
