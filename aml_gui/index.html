<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/vite.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>AML - AudioMIDI Link</title>
        <link rel="stylesheet" href="/src/styles.css" />
        <style>
            :root {
                font-family: Inter, Avenir, Helvetica, Arial, sans-serif;
                color-scheme: light dark;
                background-color: #242424;
                color: rgba(255, 255, 255, 0.87);
            }

            body {
                margin: 0;
                display: flex;
                place-items: center;
                min-width: 320px;
                min-height: 100vh;
            }

            .container {
                max-width: 800px;
                margin: 0 auto;
                padding: 2rem;
                text-align: center;
                width: 100%;
            }

            h1 {
                font-size: 2.5em;
                line-height: 1.1;
            }

            .card {
                padding: 1.5em;
                background-color: #333;
                border-radius: 8px;
                margin-bottom: 1em;
                text-align: left;
            }

            .row {
                display: flex;
                gap: 1em;
                align-items: center;
            }

            .col {
                flex: 1;
                display: flex;
                flex-direction: column;
                gap: 0.5em;
            }

            button {
                border-radius: 8px;
                border: 1px solid transparent;
                padding: 0.6em 1.2em;
                font-size: 1em;
                font-weight: 500;
                font-family: inherit;
                background-color: #1a1a1a;
                cursor: pointer;
                transition: border-color 0.25s;
                color: white;
            }
            button:hover {
                border-color: #646cff;
            }
            button:focus,
            button:focus-visible {
                outline: 4px auto -webkit-focus-ring-color;
            }
            button:disabled {
                opacity: 0.5;
                cursor: not-allowed;
            }

            select {
                padding: 0.6em;
                border-radius: 4px;
                background-color: #1a1a1a;
                color: white;
                border: 1px solid #444;
            }

            .display-box {
                background: #000;
                padding: 1em;
                border-radius: 4px;
                font-family: monospace;
                color: #0f0;
                min-height: 3em;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 1.2em;
                margin-top: 10px;
            }

            .log-box {
                background: #111;
                height: 150px;
                overflow-y: auto;
                padding: 0.5em;
                font-family: monospace;
                font-size: 0.9em;
                border: 1px solid #444;
                white-space: pre-wrap;
            }

            .hint {
                font-size: 0.8em;
                color: #888;
            }

            .meter-container {
                width: 100%;
                height: 10px;
                background-color: #222;
                border-radius: 5px;
                margin-top: 10px;
                overflow: hidden;
            }
            .meter-bar {
                height: 100%;
                width: 0%;
                background-color: #0f0;
                transition: width 0.05s ease-out;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>AML - AudioMIDI Link</h1>

            <div class="card">
                <h2>Configuration</h2>
                <div class="row">
                    <div class="col">
                        <label for="input-device-select"
                            >Input Device (Microphone)</label
                        >
                        <select id="input-device-select">
                            <option value="">Loading...</option>
                        </select>
                    </div>
                    <div class="col">
                        <label for="output-device-select"
                            >Output Device (Speakers)</label
                        >
                        <select id="output-device-select">
                            <option value="">Loading...</option>
                        </select>
                    </div>
                </div>
                <div
                    class="row"
                    style="margin-top: 10px; justify-content: flex-end"
                >
                    <button id="refresh-devices-btn">Refresh Devices</button>
                </div>
            </div>

            <div class="row">
                <!-- Decoder Control -->
                <div class="card col">
                    <h2>Decoder (Receiver)</h2>
                    <div class="row">
                        <button id="start-listening-btn">
                            Start Listening
                        </button>
                        <button id="stop-listening-btn" disabled>Stop</button>
                    </div>
                    <div id="decoded-display" class="display-box">
                        <span style="color: #555">Waiting for signal...</span>
                    </div>
                    <div class="meter-container" title="Input Level">
                        <div id="input-meter" class="meter-bar"></div>
                    </div>
                </div>

                <!-- Encoder Control -->
                <div class="card col">
                    <h2>Encoder (Test)</h2>
                    <div class="row">
                        <button id="start-test-btn">Start Test Sequence</button>
                        <button id="stop-test-btn" disabled>Stop</button>
                    </div>
                    <p class="hint">Plays a C-Major scale loop.</p>
                </div>
            </div>

            <div class="card">
                <h2>System Logs</h2>
                <div id="log-container" class="log-box"></div>
            </div>
        </div>

        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
