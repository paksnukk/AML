[package]
name = "aml_engine"
version = "0.1.0"
edition = "2021"
description = "AML real-time engine: audio/MIDI I/O and encoder/decoder workers shared by the GUI and CLI"

[features]
# In-memory audio/MIDI endpoints for hardware-free tests (always on under `cfg(test)`).
testing = []

[dependencies]
aml_core = { path = "../aml_core" }
cpal = "0.15"
midir = "0.9"
ringbuf = "0.3"
anyhow = "1.0"
